# App-signed ScanProof gate (design for gate-lab#13 F1). NOT wired to the ruleset yet.
#
# Why: a `pull_request` workflow is the PR's own code, so a PR can make a job named
# "ScanProof verification" succeed (trial 3, PR #15). Any workflow can also mint
# GitHub Actions (app 15368) check runs. This workflow instead:
#   * runs on pull_request_target, so the workflow, policy and rules come from `main`;
#   * scans PR code as data only (Semgrep reads files; nothing from the PR is executed);
#   * reports the decision as a dedicated GitHub App whose private key lives in the
#     `gate-signer` environment, deployable from `main` only (see trial 4), so no PR
#     workflow can read the key or impersonate the check.
#
# Owner setup before enabling (not automatable from Claude's session):
#   1. Create a GitHub App: Checks read/write only; webhook off; this account only.
#   2. Install it on this repository only.
#   3. Environment `gate-signer`: deployment branches = Selected -> `main` only;
#      secret GATE_APP_PRIVATE_KEY (environment secret, never a repository secret);
#      variable GATE_APP_CLIENT_ID.
#   4. After a forged PR is shown to fail, require check "ScanProof signed verification"
#      with integration_id = the App's ID in ruleset 26224149.
name: ScanProof signed gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: signed-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan-semgrep:
    # Name must match the trusted policy's job_name (ScanProof matches job names).
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.181.1
    permissions:
      contents: read
    steps:
      - name: Trusted rules and policy from the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Untrusted PR head, as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - name: Scan PR code with the base branch's rules
        run: semgrep scan --config .semgrep/rules.yml --metrics=off --json --output semgrep.json pr/demo/
      - name: Upload scan evidence even if the scanner fails
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-lab-semgrep
          path: semgrep.json
          if-no-files-found: warn

  verify:
    needs: [scan-semgrep]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Trusted policy from the base branch (PR head is never checked out here)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install reviewed ScanProof source revision
        run: python -m pip install "git+https://github.com/abdelrahman-eladwy/scanproof.git@0f12c1470b0f84ab0eb18d17ec3a6199eb64943f"
      - name: Verify this run against the base branch's policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          scanproof verify --provider github
          -p "$GITHUB_REPOSITORY" --pipeline "$GITHUB_RUN_ID"
          -P .scanproof/policy.yaml -o scanproof-decision.json
      - name: Retain decision evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-lab-signed-decision
          path: scanproof-decision.json
          if-no-files-found: warn

  sign:
    needs: [verify]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    environment: gate-signer
    permissions: {}
    steps:
      - name: Mint a short-lived Checks-only token as the gate App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GATE_APP_PRIVATE_KEY }}
          permission-checks: write
      - name: Report the decision on the PR head commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Fail closed: only an explicit verify success is a pass.
          if [ "$VERIFY_RESULT" = "success" ]; then conclusion=success; else conclusion=failure; fi
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="ScanProof signed verification" \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f details_url="$RUN_URL" \
            -f "output[title]=ScanProof: $conclusion" \
            -f "output[summary]=verify job result: $VERIFY_RESULT (policy and rules from the base branch)"
