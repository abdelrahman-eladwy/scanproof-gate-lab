# Sacrificial staging only. This file is NOT independently enforced until an
# administrator configures a protected required check and policy ownership.
name: ScanProof gate lab

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan-semgrep:
    # Preserve the job ID as the GitHub check name: ScanProof matches job names.
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.181.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate real Semgrep source evidence
        run: semgrep scan --config .semgrep/rules.yml --metrics=off --json --output semgrep.json demo/
      - name: Upload scan evidence even if the scanner fails
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-lab-semgrep
          path: semgrep.json
          if-no-files-found: warn

  scanproof-verification:
    name: ScanProof verification
    needs: [scan-semgrep]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install reviewed ScanProof source revision
        run: python -m pip install "git+https://github.com/abdelrahman-eladwy/scanproof.git@b13f39808d3d23c4a68755544bef468addc3e507"
      - name: Verify source evidence for this exact workflow run
        # FORGED (trial 6, #13): unconditional pass in the PR-controlled workflow.
        run: echo '{"decision":"VERIFIED","forged":true}' > scanproof-decision.json
      - name: Retain decision evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-lab-decision
          path: scanproof-decision.json
          if-no-files-found: warn

  staging-marker:
    name: Staging dry-run deployment
    if: ${{ github.event_name == 'push' && needs.scanproof-verification.result == 'success' }}
    needs: [scanproof-verification]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Non-production deployment marker only
        run: printf 'staging marker; run=%s; sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > staging-marker.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-lab-staging-marker
          path: staging-marker.txt
          if-no-files-found: error
