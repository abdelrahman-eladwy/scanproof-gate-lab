# Stage 1 demonstrator only; in-repo policy is mutable until CODEOWNERS
# and required branch checks are independently enforced by GitHub.
apiVersion: scanproof.dev/v1alpha1
kind: PipelineAssurancePolicy
metadata: {name: gate-lab-sast}
project: {provider: github, id: abdelrahman-eladwy/scanproof-gate-lab}
assurance: {minimum_level: reported_scope}
requirements:
  - id: SAST
    tool: semgrep
    job_name: scan-semgrep
    artifact_name: gate-lab-semgrep
    report_path: semgrep.json
    checks:
      scanner_errors_allowed: 0
      minimum_scanned_files: 1
  - id: SCA
    tool: trivy
    job_name: scan-trivy
    artifact_name: gate-lab-trivy
    report_path: trivy.json
    checks:
      minimum_scanned_files: 1
enforcement: {on_unknown: block, on_nothing_applicable: block}
